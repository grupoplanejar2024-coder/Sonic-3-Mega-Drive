<!DOCTYPE html>
<html lang="pt-pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sonic 3 Complete — KUBO TOUCH</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 48px;
      padding: 0 14px;
      background: #121829;
      border-bottom: 1px solid #222c46;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      flex-shrink: 0;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .game-title {
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }
    #game-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #game {
      width: 100%;
      height: 100%;
    }

    /* Oculta botão "Sair" / exit sobreposto no emulador */
    .ejs_exit_btn,
    .ejs_exit_button,
    [class*="exit"] {
      display: none !important;
      visibility: hidden !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">KUBO TOUCH</span>
    <span class="game-title">Sonic 3 Complete (Mega Drive)</span>
  </header>

  <div id="game-wrapper">
    <div id="game"></div>
  </div>

  <script>
    const ROM_URL = "./Sonic3C.gen";
    const CDN_LIST = [
      "https://cdn.emulatorjs.org/stable/data/",
      "https://cdn.emulatorjs.org/latest/data/"
    ];

    function hideExitButtons() {
      const candidates = document.querySelectorAll("#game-wrapper button, #game-wrapper div, #game-wrapper span, #game-wrapper a");
      candidates.forEach((el) => {
        const text = (el.textContent || "").trim().toLowerCase();
        if (text === "× sair" || text === "sair" || text === "x sair" || text.includes("sair")) {
          if (el.children.length === 0) {
            el.style.setProperty("display", "none", "important");
            el.style.setProperty("visibility", "hidden", "important");
          }
        }
      });
    }

    const observer = new MutationObserver(() => {
      hideExitButtons();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function focusGameCanvas() {
      const gameEl = document.getElementById("game");
      if (!gameEl) return;
      gameEl.setAttribute("tabindex", "0");
      gameEl.focus({ preventScroll: true });

      const canvas = gameEl.querySelector("canvas");
      if (canvas) {
        canvas.setAttribute("tabindex", "0");
        canvas.focus({ preventScroll: true });
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space", " "].includes(e.key)) {
        e.preventDefault();
      }
    }, { passive: false });

    document.getElementById("game-wrapper").addEventListener("pointerdown", () => {
      focusGameCanvas();
      hideExitButtons();
    });

    function loadEmulator(cdnIndex = 0) {
      const oldScript = document.getElementById("ejs-loader");
      if (oldScript) oldScript.remove();

      window.EJS_player = "#game";
      window.EJS_core = "genesis_plus_gx";
      window.EJS_gameName = "Sonic 3 Complete";
      window.EJS_gameUrl = ROM_URL;
      window.EJS_pathtodata = CDN_LIST[cdnIndex];
      window.EJS_startOnLoaded = true;
      window.EJS_language = "pt-PT";

      const script = document.createElement("script");
      script.id = "ejs-loader";
      script.src = CDN_LIST[cdnIndex] + "loader.js";
      script.async = true;

      script.onload = () => {
        hideExitButtons();
        setTimeout(() => {
          focusGameCanvas();
          hideExitButtons();
        }, 600);
        setTimeout(() => {
          focusGameCanvas();
          hideExitButtons();
        }, 1500);
      };

      script.onerror = () => {
        if (cdnIndex + 1 < CDN_LIST.length) {
          loadEmulator(cdnIndex + 1);
        }
      };

      document.body.appendChild(script);
    }

    loadEmulator(0);
  </script>
</body>
</html>
