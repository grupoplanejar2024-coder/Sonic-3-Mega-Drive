<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sonic 3 - KUBO TOUCH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #090d16;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
  </div>

  <script>
    // Configurações do EmulatorJS para Sega Mega Drive / Genesis
    EJS_player = "#game";
    EJS_core = "segaMD"; // Alternativa: "genesis_plus_gx" se o teu build suportar
    EJS_gameName = "Sonic 3";
    EJS_color = "#1d4ed8";
    EJS_startOnLoaded = true;
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

    // Substitui pelo caminho real da tua ROM hospedada (ex.: ./roms/sonic3.md ou sonic-3-complete.bin)
    EJS_gameUrl = "./roms/sonic3.md";

    // Ativa controlos touch em dispositivos móveis
    EJS_VirtualGamepadSettings = {
      enabled: true
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
