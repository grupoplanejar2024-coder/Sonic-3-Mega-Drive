<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sonic 3 Complete — KUBO TOUCH</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b0f19;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 48px;
      padding: 0 14px;
      background: #121829;
      border-bottom: 1px solid #222c46;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      flex-shrink: 0;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #38bdf8;
    }
    .game-title {
      font-weight: 600;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-left: 10px;
    }
    #game-wrapper {
      flex: 1;
      width: 100%;
      height: calc(100% - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    #game {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">KUBO TOUCH</span>
    <span class="game-title">Sonic 3 Complete (Mega Drive)</span>
  </header>

  <div id="game-wrapper">
    <div id="game"></div>
  </div>

  <script>
    EJS_player = "#game";
    EJS_core = "segaMD";
    EJS_gameName = "Sonic 3 Complete";
    EJS_gameUrl = "roms/sonic-3-complete.md"; // Altera para o caminho/nome exato da tua ROM no repo
    EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
    EJS_startOnLoaded = true;
    EJS_language = "pt-PT";

    // Controlos virtuais otimizados para ecrã tátil (telemóvel)
    EJS_virtualGamepadSettings = {
      enabled: true
    };
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
