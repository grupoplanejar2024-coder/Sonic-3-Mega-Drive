<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projeto Web</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #111318;
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }
    .container {
      width: 100%;
      max-width: 900px;
      background: #1b1f27;
      border: 1px solid #2d3340;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }
    h1 {
      font-size: 1.4rem;
      margin-bottom: 8px;
    }
    p {
      color: #9ca3af;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }
    .screen {
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #090a0d;
      border: 1px dashed #3b4254;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Título da Página</h1>
    <p>Substitui este bloco pelo teu conteúdo ou integração.</p>
    <div id="app" class="screen">Área principal</div>
  </div>

  <script>
    // Adiciona aqui a lógica JavaScript necessária
  </script>
</body>
</html>
